databases:
  - name: custom-homes-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: custom-homes-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @custom-homes/server build
    startCommand: pnpm --filter @custom-homes/server start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: custom-homes-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: WEB_ORIGIN
        sync: false
